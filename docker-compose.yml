# Serviços de apoio. O orquestrador e os agentes rodam como processo local (ADR 014); o único
# container de execução de código é o sandbox, criado sob demanda pela skill de código.
services:

  qdrant:
    # Imagem oficial multi-arquitetura (amd64/arm64), versão alinhada ao qdrant-client do uv.lock (1.19.1).
    # Validada no Raspberry Pi 5 com o kernel padrão (páginas de 16K). Versões antigas tiveram falha de jemalloc
    # nesse kernel (qdrant/qdrant#5952); não trocar de versão sem testar no Pi.
    image: ${QDRANT_IMAGE:-qdrant/qdrant:v1.19.1}
    container_name: geminiclaw-qdrant
    restart: unless-stopped
    # TODO(segurança): publicar apenas em 127.0.0.1 antes de sair do ambiente de desenvolvimento.
    # Hoje fica em 0.0.0.0, sem autenticação, para facilitar o acesso pela rede/Tailscale; não há dados sensíveis.
    ports:
      - "0.0.0.0:6333:6333"
      - "0.0.0.0:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
      QDRANT__SERVICE__HOST: "0.0.0.0"
    # A imagem oficial não tem curl nem wget; usa-se o /dev/tcp do bash para consultar /readyz.
    healthcheck:
      test:
        - "CMD"
        - "bash"
        - "-c"
        - "exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /readyz HTTP/1.0\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  postgres:
    # V17 (ADR 009 §4): PostgreSQL 16 + Apache AGE, substitui postgres:16-alpine.
    # Ver containers/Dockerfile.postgres para o aviso de risco de colação
    # (musl -> glibc) sobre o volume postgres_data existente — requer decisão
    # explícita antes de aplicar em ambiente com dados reais.
    build:
      context: .
      dockerfile: containers/Dockerfile.postgres
    container_name: geminiclaw-postgres
    restart: unless-stopped
    # Pré-carrega a extensão AGE para todas as conexões (ver nota no Dockerfile).
    command: ["postgres", "-c", "shared_preload_libraries=age"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-geminiclaw}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-geminiclaw_secret}
      POSTGRES_DB: ${POSTGRES_DB:-geminiclaw}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-geminiclaw}"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: geminiclaw-ollama
    profiles: ["local-llm"]
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # No Pi 5, recomenda-se usar Ollama nativo para melhor performance.
    # Este serviço é útil para desenvolvimento em x86 ou se preferir isolamento.

volumes:
  postgres_data:
  qdrant_data:
  ollama_data:
