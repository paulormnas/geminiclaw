# Catálogo versionado de modelos e papéis (ADR 017, mudança OpenSpec v16-model-catalog-router).
#
# `versao` sobe a cada mudança de conteúdo. Os fatos de cada modelo (`ferramentas`,
# `saida_estruturada`, `janela_contexto`, `trust`) são os que o roteador filtra; nenhum campo
# fora deste esquema é aceito. `janela_contexto` está em tokens e deve ser conferida contra a
# documentação de cada provedor na revisão do PR. A ordem de `preferencia` reproduz o mapeamento
# usado no Raspberry Pi (Developer, Summarizer e Base no Gemini; Researcher, Validator e Reviewer
# no Claude), com modelos Ollama ao final de cada lista para que a sessão funcione sob
# `LLM_DATA_POLICY=self_hosted_only` (padrão).
versao: 1

